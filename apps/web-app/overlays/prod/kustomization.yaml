apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web-app-prod
resources:
  - ../../base
  - ../../../../rbac
patches:
  - path: patch-replicas.yaml
configMapGenerator:
  - name: web-app-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=warn
images:
  - name: quay.io/sailaja/web-app
    newTag: "1.0.0"
