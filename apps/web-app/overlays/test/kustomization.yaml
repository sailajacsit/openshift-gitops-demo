apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web-app-test
resources:
  - ../../base
  - ../../../../rbac
patches:
  - path: patch-replicas.yaml
configMapGenerator:
  - name: web-app-config
    behavior: merge
    literals:
      - APP_ENV=test
      - LOG_LEVEL=debug
images:
  - name: quay.io/sailaja/web-app
    newTag: "1.1.0-rc1"
